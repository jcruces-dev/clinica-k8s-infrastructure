# Versión de la API de Kubernetes para cargas de trabajo con estado (StatefulSets).
apiVersion: apps/v1

# Tipo de recurso: StatefulSet (ideal para bases de datos, garantiza orden e identidad).
kind: StatefulSet

# Metadatos del recurso.
metadata:
  # Nombre único del StatefulSet.
  name: postgres-statefulset
  # Namespace de pruebas.
  namespace: test
  # Etiquetas para identificar el recurso.
  labels:
    app: postgres
    env: test

# Especificación del comportamiento del StatefulSet.
spec:
  # Nombre del Headless Service vinculado (obligatorio para el DNS de los Pods).
  serviceName: "postgres-service"
  # 1 réplica para pruebas.
  replicas: 1
  
  # Selector que vincula el StatefulSet con los Pods.
  selector:
    matchLabels:
      app: postgres
      env: test

  # Plantilla para crear los Pods.
  template:
    metadata:
      labels:
        app: postgres
        env: test
    spec:
      # Definición del contenedor.
      containers:
        - name: postgres
          # Imagen oficial de PostgreSQL.
          image: postgres:15
          # Puerto expuesto.
          ports:
            - containerPort: 5432

          # Variables de entorno.
          env:
            # Evita el error de la carpeta 'lost+found' en GCP.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            # Credenciales desde el Secret.
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

          # Parámetros de arranque para usar configuraciones personalizadas.
          args:
            - "-c"
            - "config_file=/etc/postgresql/conf.d/postgresql.conf"
            - "-c"
            - "hba_file=/etc/postgresql/conf.d/pg_hba.conf"

          # Sondas de salud para asegurar que Postgres esté listo.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10

          # Recursos asignados (coinciden con LimitRange de Test).
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # Montaje de volúmenes.
          volumeMounts:
            # Volumen de datos.
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            # Archivo de configuración pg_hba.conf.
            - name: postgres-config-volume
              mountPath: /etc/postgresql/conf.d/pg_hba.conf
              subPath: pg_hba.conf
            # Archivo de configuración postgresql.conf.
            - name: postgres-config-volume
              mountPath: /etc/postgresql/conf.d/postgresql.conf
              subPath: postgresql.conf

      # Definición de volúmenes.
      volumes:
        # Volumen conectado al almacenamiento persistente.
        - name: postgres-storage
          persistentVolumeClaim:
            # Nombre del PVC de Test.
            claimName: postgres-pvc-test-v2
        # Volumen del ConfigMap.
        - name: postgres-config-volume
          configMap:
            name: postgres-config