apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv-test
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  # Enlace directo para evitar que quede atascado buscando un claim genérico
  claimRef:
    namespace: test
    name: postgres-pvc-test
  hostPath:
    path: "/data/postgres-test"
    type: DirectoryOrCreate
