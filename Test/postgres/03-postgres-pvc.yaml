# Versión de la API de Kubernetes para objetos básicos del sistema.
apiVersion: v1

# Tipo de recurso: PersistentVolumeClaim.
kind: PersistentVolumeClaim

# Metadatos que identifican esta solicitud.
metadata:
  # Nombre único del PVC. Debe coincidir con el 'claimName' de tu StatefulSet de Postgres en Test.
  name: postgres-pvc-test-v2
  # Namespace de pruebas.
  namespace: test

# Especificación de los requerimientos de almacenamiento.
spec:
  # Modos de acceso.
  accessModes:
    # ReadWriteOnce: Montado en lectura/escritura por un único nodo.
    - ReadWriteOnce
  
  # Al no especificar 'storageClassName', GKE usará su clase por defecto 
  # y creará un disco duro (Persistent Disk) automáticamente.
  # Definición de la cantidad de espacio solicitada.
  resources:
    requests:
      # 1 Gigabyte para el entorno de pruebas.
      storage: 1Gi