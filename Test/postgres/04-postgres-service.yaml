# Versión de la API de Kubernetes para definir un objeto de red (Service).
apiVersion: v1

# Tipo de recurso: Service.
kind: Service

# Metadatos del servicio.
metadata:
  # Nombre del servicio DNS interno.
  name: postgres-service
  # Namespace de pruebas.
  namespace: test

# Especificación de enrutamiento y puertos del servicio.
spec:
  # Selector para dirigir el tráfico a los Pods de PostgreSQL de Test.
  selector:
    app: postgres
    env: test

  # Headless Service (sin IP fija) para que los Pods tengan identidad DNS propia.
  clusterIP: None

  # Definición de los puertos expuestos.
  ports:
    # Protocolo de red.
    - protocol: TCP
      # Puerto expuesto internamente.
      port: 5432
      # Puerto del contenedor.
      targetPort: 5432