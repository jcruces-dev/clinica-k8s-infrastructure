# Versión de la API de Kubernetes usada para definir un ConfigMap.
apiVersion: v1

# Tipo de recurso: ConfigMap.
kind: ConfigMap

# Metadatos para identificar el recurso.
metadata:
  # Nombre del ConfigMap.
  name: postgres-config
  # Namespace de pruebas.
  namespace: test

# Sección que contiene los archivos de configuración.
data:
  # Archivo de configuración principal de PostgreSQL.
  postgresql.conf: |
    # Escucha peticiones en todas las interfaces de red.
    listen_addresses = '*'

  # Archivo de reglas de acceso.
  pg_hba.conf: |
    # Conexiones locales: requieren contraseña (md5).
    local   all   all   md5

    # Conexiones TCP/IP externas: permiten 0.0.0.0/0 (útil para tests locales).
    host    all   all   0.0.0.0/0   md5