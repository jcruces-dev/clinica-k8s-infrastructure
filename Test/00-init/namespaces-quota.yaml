apiVersion: v1
kind: ResourceQuota
metadata:
  name: test-quota
  namespace: test
spec:
  hard:
    # Ajustado para que Dev y Test quepan en el nodo de 2 vCPUs
    requests.cpu: "1000m" 
    requests.memory: "3Gi"
    # Los límites máximos pueden quedar igual
    limits.cpu: "8"
    limits.memory: "12Gi"
    pods: "50"