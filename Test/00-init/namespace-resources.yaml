# ==========================================================
# CONFIGURACIÓN PARA EL NAMESPACE: test
# ==========================================================
apiVersion: v1
kind: ResourceQuota
metadata:
  name: test-quota
  namespace: test
spec:
  hard:
    requests.cpu: "500m"        # Máximo acumulado a solicitar: 0.5 Cores
    requests.memory: "512Mi"    # Máximo acumulado a solicitar: 512 MB
    limits.cpu: "1000m"         # Máximo límite acumulado: 1 Core
    limits.memory: "768Mi"      # Máximo límite acumulado: 768 MB
    pods: "10"                  # Máximo 10 Pods en el namespace
