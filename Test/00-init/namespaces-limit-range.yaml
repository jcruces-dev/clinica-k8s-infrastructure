apiVersion: v1
kind: LimitRange
metadata:
  name: test-limits
  namespace: test
spec:
  limits:
  - default:                    # Límite asignado automáticamente si el Pod no especifica
      cpu: "300m"
      memory: "256Mi"
    defaultRequest:             # Solicitud asignada automáticamente si el Pod no especifica
      cpu: "100m"
      memory: "128Mi"
    max:                        # Lo máximo que puede pedir un solo Pod individual
      cpu: "500m"
      memory: "512Mi"
    min:                        # Lo mínimo que puede pedir un Pod
      cpu: "50m"
      memory: "64Mi"
    type: Container
