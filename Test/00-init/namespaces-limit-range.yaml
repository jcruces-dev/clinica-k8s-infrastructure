# Versión de la API de Kubernetes utilizada para crear recursos básicos.
apiVersion: v1

# Tipo de recurso: LimitRange.
kind: LimitRange

# Metadatos del recurso.
metadata:
  # Nombre del LimitRange.
  name: app-limits

  # Namespace de pruebas (QA).
  namespace: test

# Configuración principal.
spec:
  limits:
  # Regla aplicada a cada contenedor individual.
  - type: Container

    # Valores por defecto para requests (Test es intermedio).
    defaultRequest:
      # 100m = 0.1 vCPU.
      cpu: "100m"
      # 128Mi de memoria.
      memory: "128Mi"

    # Valores por defecto para limits.
    default:
      # 500m = 0.5 vCPU.
      cpu: "500m"
      # 512Mi de memoria.
      memory: "512Mi"

    # Límites mínimos permitidos.
    min:
      # 50m de CPU.
      cpu: "50m"
      # 64Mi de RAM.
      memory: "64Mi"

    # Límites máximos permitidos para un solo contenedor en Test.
    max:
      # 1 vCPU. El doble que Dev.
      cpu: "1"
      # 1Gi de RAM.
      memory: "1Gi"