# Versión de la API de Kubernetes para definir Deployments.
apiVersion: apps/v1

# Tipo de recurso: Deployment.
kind: Deployment

# Metadatos del recurso.
metadata:
  # Nombre del Deployment.
  name: frontend-deployment
  # Namespace de pruebas.
  namespace: test
  # Etiquetas para identificar el recurso.
  labels:
    app: frontend
    env: test

# Especificación del Deployment.
spec:
  # 1 réplica para el entorno de pruebas.
  replicas: 1
  
  # Selector que vincula el Deployment con los Pods.
  selector:
    matchLabels:
      app: frontend
      env: test

  # Plantilla para crear los Pods.
  template:
    metadata:
      labels:
        app: frontend
        env: test
    spec:
      # Secreto para descargar la imagen privada de GHCR.
      imagePullSecrets:
        - name: ghcr-secret

      # Definición de los contenedores.
      containers:
        - name: frontend
          # Imagen del frontend (Nginx).
          image: ghcr.io/jcruces-dev/frontend-clinica-bp:sha-97d7ccd22922d7ca996619e2a7384034cbfcf0bf
          ports:
            - containerPort: 80
            
          # Límites de recursos ajustados al LimitRange de Test.
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"