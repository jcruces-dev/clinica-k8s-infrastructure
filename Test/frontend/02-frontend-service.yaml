# Versión de la API de Kubernetes para definir Services.
apiVersion: v1

# Tipo de recurso: Service.
kind: Service

# Metadatos del recurso.
metadata:
  # Nombre del Service.
  name: frontend-service
  # Namespace de pruebas.
  namespace: test
  # Etiquetas para identificar el recurso.
  labels:
    app: frontend
    env: test

# Especificación del Service.
spec:
  # Selector: Enruta el tráfico a los Pods de frontend en Test.
  selector:
    app: frontend
    env: test

  # Configuración de los puertos.
  ports:
    - protocol: TCP
      # Puerto expuesto dentro del clúster.
      port: 80
      # Puerto del contenedor de Nginx.
      targetPort: 80
      
  # En Test también usamos LoadBalancer para que el equipo de QA acceda.
  type: LoadBalancer