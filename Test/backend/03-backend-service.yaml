# Versión de la API para objetos de red básicos.
apiVersion: v1

# Tipo de recurso: Service.
kind: Service

# Metadatos del Service.
metadata:
  # Nombre del servicio.
  name: backend-service
  # Namespace de pruebas (QA).
  namespace: test
  # Etiquetas.
  labels:
    app: backend
    env: test

# Especificación de enrutamiento.
spec:
  # Selector: Enruta a los Pods de Test.
  selector:
    app: backend
    env: test

  # Configuración de los puertos.
  ports:
    - protocol: TCP
      # Puerto expuesto.
      port: 8000
      # Puerto del contenedor.
      targetPort: 8000

  # En Test mantenemos LoadBalancer para que el QA pueda hacer pruebas directas a la API.
  type: LoadBalancer