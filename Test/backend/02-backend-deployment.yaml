# Versión de la API de Kubernetes para definir Deployments.
apiVersion: apps/v1

# Tipo de recurso: Deployment.
kind: Deployment

# Metadatos del recurso.
metadata:
  name: backend-deployment
  # Namespace de pruebas.
  namespace: test
  labels:
    app: backend
    env: test

# Especificación del Deployment.
spec:
  # 1 réplica para pruebas.
  replicas: 1
  
  selector:
    matchLabels:
      app: backend
      env: test

  template:
    metadata:
      labels:
        app: backend
        env: test
    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: backend
          # Imagen del backend.
          image: ghcr.io/jcruces-dev/backend-clinica-bp:sha-2d0b7b68064400a391dbb4398a8d35aa5d1e165a
          ports:
            - containerPort: 8000

          env:
            # En Test también permitimos todo para pruebas.
            - name: ALLOWED_HOSTS
              value: "*"
            - name: CORS_ALLOW_ALL_ORIGINS
              value: "True"
            
            # (Nota: Eliminé la variable PGDATA que tenías aquí porque es exclusiva de la BD, no del backend).
            
            # Inyección de secretos.
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SECRET_KEY
            - name: DEBUG
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DEBUG
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: POSTGRES_PASSWORD
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PORT
            - name: EMAIL_BACKEND
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_BACKEND
            - name: EMAIL_HOST
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_HOST
            - name: EMAIL_PORT
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_PORT
            - name: EMAIL_USE_TLS
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_USE_TLS
            - name: EMAIL_HOST_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_HOST_USER
            - name: EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_HOST_PASSWORD
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: STRIPE_SECRET_KEY
          
          # Recursos asignados (coinciden con el LimitRange de Test).
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"