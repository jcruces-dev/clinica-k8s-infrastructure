apiVersion: apps/v1              # Versión de la API de Kubernetes para Deployments
kind: Deployment                 # Tipo de recurso: Deployment

metadata:
  name: backend-deployment       # Nombre único del Deployment
  namespace: test                # Namespace donde se desplegará (test)
  labels:                        # Etiquetas para identificar el recurso
    app: backend                 # Etiqueta de la aplicación
    env: test                    # Etiqueta del entorno

spec:
  replicas: 1                    # Número de Pods (1 réplica para test)
  selector:                      # Selector que define qué Pods controla
    matchLabels:
      app: backend
      env: test

  template:                      # Plantilla para crear los Pods
    metadata:
      labels:
        app: backend
        env: test
    spec:
      imagePullSecrets:          # Secret para descargar la imagen de GHCR
        - name: ghcr-secret      # Nombre del Secret de docker-registry

      containers:
        - name: backend
          image: ghcr.io/jcruces-dev/backend-clinica-bp:v1.0.1 # Imagen del backend
          ports:
            - containerPort: 8000 # Puerto expuesto por Django

          env:                   # Variables de entorno
            # 1. SOLUCIÓN PARA GCP (Almacenamiento y Red)
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: ALLOWED_HOSTS
              value: "*"
            - name: CORS_ALLOW_ALL_ORIGINS
              value: "True"

            # 2. CONEXIÓN A LA BASE DE DATOS (Usando backend-secret)
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SECRET_KEY
            - name: DEBUG
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DEBUG
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: POSTGRES_PASSWORD
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PORT

            # 3. VARIABLES DE CORREO Y STRIPE
            - name: EMAIL_BACKEND
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_BACKEND
            - name: EMAIL_HOST
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_HOST
            - name: EMAIL_PORT
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_PORT
            - name: EMAIL_USE_TLS
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_USE_TLS
            - name: EMAIL_HOST_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_HOST_USER
            - name: EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_HOST_PASSWORD
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: STRIPE_SECRET_KEY

          # 4. LÍMITES DE RECURSOS (Buena práctica)
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"