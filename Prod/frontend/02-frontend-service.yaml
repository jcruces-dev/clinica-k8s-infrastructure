# Versión de la API de Kubernetes para definir Services.
apiVersion: v1

# Tipo de recurso: Service.
kind: Service

# Metadatos del recurso.
metadata:
  # Nombre del Service.
  name: frontend-service
  # 👇 CORRECCIÓN CRÍTICA: Ahora apunta al namespace de producción.
  namespace: prod
  # Etiquetas para identificar el recurso.
  labels:
    app: frontend
    # 👇 CORRECCIÓN CRÍTICA: Etiqueta de entorno actualizada.
    env: prod

# Especificación del Service.
spec:
  # Selector: Enruta el tráfico a los Pods de frontend en Prod.
  selector:
    app: frontend
    env: prod

  # Configuración de los puertos.
  ports:
    - protocol: TCP
      # Puerto expuesto a internet (HTTP).
      port: 80
      # Puerto del contenedor de Nginx.
      targetPort: 80
      
  # EN PRODUCCIÓN SÍ O SÍ ES LOADBALANCER, Ojo acá y NO OLVIDAR XD.
  # Esto le dice a GCP que asigne una IP pública estática y cree un balanceador 
  # de carga para recibir a todos los pacientes de la clínica.
  type: LoadBalancer