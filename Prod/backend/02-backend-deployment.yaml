apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: prod
  labels:
    app: backend
    env: prod
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: clinica-bp
    app.kubernetes.io/managed-by: gitops
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: backend
      env: prod
  template:
    metadata:
      labels:
        app: backend
        env: prod
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: clinica-bp
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend
              env: prod
      containers:
        - name: backend
          image: ghcr.io/jcruces-dev/backend-clinica-bp:v1.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          command:
            - sh
            - -c
          args:
            - |
              if [ -f manage.py ]; then
                exec gunicorn clinica_drf.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60 --graceful-timeout 25 --access-logfile - --error-logfile -
              elif [ -f Clinica_DRF/manage.py ]; then
                cd Clinica_DRF
                exec gunicorn clinica_drf.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60 --graceful-timeout 25 --access-logfile - --error-logfile -
              else
                exec gunicorn clinica_drf.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60 --graceful-timeout 25 --access-logfile - --error-logfile -
              fi
          env:
            - name: ALLOWED_HOSTS
              value: "*"
            - name: CORS_ALLOW_ALL_ORIGINS
              value: "False"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: { name: backend-secret, key: SECRET_KEY }
            - name: DEBUG
              valueFrom:
                secretKeyRef: { name: backend-secret, key: DEBUG }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: backend-secret, key: POSTGRES_DB }
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: backend-secret, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: backend-secret, key: POSTGRES_PASSWORD }
            - name: DB_HOST
              valueFrom:
                secretKeyRef: { name: backend-secret, key: DB_HOST }
            - name: DB_PORT
              valueFrom:
                secretKeyRef: { name: backend-secret, key: DB_PORT }
            - name: EMAIL_BACKEND
              valueFrom:
                secretKeyRef: { name: backend-secret, key: EMAIL_BACKEND }
            - name: EMAIL_HOST
              valueFrom:
                secretKeyRef: { name: backend-secret, key: EMAIL_HOST }
            - name: EMAIL_PORT
              valueFrom:
                secretKeyRef: { name: backend-secret, key: EMAIL_PORT }
            - name: EMAIL_USE_TLS
              valueFrom:
                secretKeyRef: { name: backend-secret, key: EMAIL_USE_TLS }
            - name: EMAIL_HOST_USER
              valueFrom:
                secretKeyRef: { name: backend-secret, key: EMAIL_HOST_USER }
            - name: EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef: { name: backend-secret, key: EMAIL_HOST_PASSWORD }
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: backend-secret, key: STRIPE_SECRET_KEY }
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /admin/login/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /admin/login/
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
