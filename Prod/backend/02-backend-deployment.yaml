# Versión de la API de Kubernetes para definir Deployments.
apiVersion: apps/v1

# Tipo de recurso: Deployment.
kind: Deployment

# Metadatos del recurso.
metadata:
  name: backend-deployment
  # Ahora apunta al namespace de producción.
  namespace: prod
  labels:
    app: backend
    # Etiqueta de entorno actualizada.
    env: prod

# Especificación del Deployment.
spec:
  # 3 réplicas para Alta Disponibilidad (si una falla, quedan 2).
  replicas: 3
  
  selector:
    matchLabels:
      app: backend
      env: prod

  template:
    metadata:
      labels:
        app: backend
        env: prod
    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: backend
          # Imagen del backend (Mi pipeline de prod cambiará este tag por v1.0.0, etc.).
          image: ghcr.io/jcruces-dev/backend-clinica-bp:v1.0.1
          ports:
            - containerPort: 8000

          env:
            # Seguridad. No permitimos "*". 
            # Reemplaza esto por tu dominio real (ej. "clinica.jair-dev.cl,backend-service").
            - name: ALLOWED_HOSTS
              value: "clinica.jair-dev.cl"
            # Desactivamos CORS abierto por seguridad.
            - name: CORS_ALLOW_ALL_ORIGINS
              value: "False"
            
            # Inyección de secretos (Los secretos de prod deben tener DEBUG=False).
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SECRET_KEY
            - name: DEBUG
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DEBUG
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: POSTGRES_PASSWORD
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PORT
            - name: EMAIL_BACKEND
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_BACKEND
            - name: EMAIL_HOST
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_HOST
            - name: EMAIL_PORT
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_PORT
            - name: EMAIL_USE_TLS
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_USE_TLS
            - name: EMAIL_HOST_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_HOST_USER
            - name: EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_HOST_PASSWORD
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: STRIPE_SECRET_KEY

          # Health Checks (Sondas).
          # LivenessProbe: Si falla, Kubernetes reinicia el Pod.
          livenessProbe:
            httpGet:
              path: /api/ # Asegúrate de que esta ruta responda en tu Django (puede ser /admin/ o /api/)
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          
          # ReadinessProbe: Si falla, Kubernetes no le envía tráfico a este Pod.
          readinessProbe:
            httpGet:
              path: /api/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5

          # Recursos aumentados (coinciden con el LimitRange de Prod).
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"