# Versión de la API de Kubernetes usada para definir un ConfigMap.
apiVersion: v1

# Tipo de recurso: ConfigMap.
kind: ConfigMap

# Metadatos para identificar el recurso.
metadata:
  # Nombre del ConfigMap.
  name: postgres-config
  # 👇 CORRECCIÓN CRÍTICA: Ahora apunta al namespace de producción.
  namespace: prod

# Sección que contiene los archivos de configuración.
data:
  # Archivo de configuración principal de PostgreSQL.
  postgresql.conf: |
    # Escucha peticiones en todas las interfaces de red del contenedor.
    listen_addresses = '*'
    
    # Aumenta el número máximo de conexiones simultáneas esto me es útil si el backend escalara a muchos Pods.
    max_connections = 200
    # Asigna más memoria RAM al caché de Postgres para consultas más rápidas.
    shared_buffers = 256MB

  # Archivo de reglas de acceso (Host-Based Authentication).
  pg_hba.conf: |
    # Conexiones locales (socket UNIX): exigen contraseña (md5).
    local   all   all   md5
    
    # En Prod, permitimos 0.0.0.0/0 porque el tráfico
    # viene enmascarado a través del Service de Kubernetes (ClusterIP).
    # En un entorno multi-nube real, aquí se restringiría a la subred de los Pods (ej. 10.244.0.0/16).
    host    all   all   0.0.0.0/0 md5