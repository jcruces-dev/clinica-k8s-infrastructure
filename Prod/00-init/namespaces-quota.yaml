# Versión de la API de Kubernetes para recursos básicos.
apiVersion: v1

# Tipo de recurso: ResourceQuota.
kind: ResourceQuota

# Metadatos del recurso.
metadata:
  # Nombre del objeto ResourceQuota.
  name: prod-quota
  # Namespace donde aplica esta cuota.
  namespace: prod

# Especificación de los límites duros.
spec:
  hard:
    # ======================================================
    # CUOTA DE RECURSOS (Requests)
    # ======================================================
    
    # 👇 AJUSTE FÍSICO: 1500m (1.5 vCPU). 
    # Sumando Dev(0.5) + Test(1) + Prod(1.5) = 3 vCPUs solicitadas en total.
    # Tu nodo tiene 4. Esto deja 1 vCPU libre para el sistema (¡Perfecto!).
    requests.cpu: "1500m"
    
    # 6Gi de memoria reservada.
    # Sumando Dev(2) + Test(4) + Prod(6) = 12Gi solicitados.
    # Tu nodo tiene 16Gi. Dejamos 4Gi para el sistema. (¡Excelente!).
    requests.memory: "6Gi"
    
    # ======================================================
    # CUOTA DE RECURSOS (Limits)
    # ======================================================
    
    # 3 vCPUs como límite total (permite picos de carga en producción).
    limits.cpu: "3"
    
    # 12Gi de memoria máxima (permite picos sin que el nodo se caiga por OOM).
    limits.memory: "12Gi"
    
    # ======================================================
    # LÍMITE DE CANTIDAD DE PODS
    # ======================================================
    
    # 50 Pods. 
    # Muy importante porque en Prod usarás HPA (Autoescalado) y podrías necesitar muchas réplicas.
    pods: "50"