# Versión de la API de Kubernetes para objetos de datos confidenciales.
apiVersion: v1

# Tipo de recurso: Secret (almacena datos sensibles en texto plano en la sección stringData).
kind: Secret

# Metadatos del Secret.
metadata:
  # Nombre del Secret exclusivo para el Backend de Django.
  name: backend-secret
  # Namespace donde estará disponible.
  namespace: dev

# Tipo de Secret genérico.
type: Opaque

# Datos confidenciales inyectados en texto claro (Kubernetes los codifica en base64 automáticamente).
stringData:
  # Variables de Django y Base de Datos
  SECRET_KEY: "CAMBIAR_EN_GCP"
  DEBUG: "True"
  POSTGRES_DB: "CAMBIAR_EN_GCP"
  POSTGRES_USER: "CAMBIAR_EN_GCP"
  POSTGRES_PASSWORD: "CAMBIAR_EN_GCP"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"

  # Variables de Correo y Stripe (Valores genéricos)
  EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
  EMAIL_HOST: "smtp.gmail.com"
  EMAIL_PORT: "587"
  EMAIL_USE_TLS: "True"
  EMAIL_HOST_USER: "jaircrucesb@gmail.com"
  EMAIL_HOST_PASSWORD: "CAMBIAR_EN_GCP" 
  STRIPE_SECRET_KEY: "CAMBIAR_EN_GCP"
