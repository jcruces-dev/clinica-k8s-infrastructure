# Versión de la API de Kubernetes para objetos de datos confidenciales.
apiVersion: v1

# Tipo de recurso: Secret (almacena datos sensibles en texto plano en la sección stringData).
kind: Secret

# Metadatos del Secret.
metadata:
  # Nombre del Secret exclusivo para el Backend de Django.
  name: backend-secret
  # Namespace donde estará disponible.
  namespace: dev

# Tipo de Secret genérico.
type: Opaque

# Datos confidenciales inyectados en texto claro (Kubernetes los codifica en base64 automáticamente).
stringData:
  # Clave secreta para seguridad de Django.
  SECRET_KEY: "django-insecure--=c#)jsm3xr88bqto!unpv9z-k(w4&f3&fxfeihlxcucp2w+*t"
  # Habilita el modo depuración en desarrollo.
  DEBUG: "True"
  # Nombre de la base de datos a la que conectará el backend.
  POSTGRES_DB: "clinica_buenpaciente"
  # Usuario de la base de datos.
  POSTGRES_USER: "postgres"
  # Contraseña del usuario de la base de datos.
  POSTGRES_PASSWORD: "1234"
  # Host del servicio de PostgreSQL (Nombre exacto de tu postgres-service).
  DB_HOST: "postgres-service"
  # Puerto de comunicación de PostgreSQL.
  DB_PORT: "5432"
