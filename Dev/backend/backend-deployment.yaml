# Versión de la API de Kubernetes para definir Deployments.
apiVersion: apps/v1

# Tipo de recurso: Deployment.
kind: Deployment

# Metadatos del recurso.
metadata:
  # Nombre del Deployment.
  name: backend-deployment
  # Namespace de desarrollo.
  namespace: dev
  # Etiquetas para identificar el recurso.
  labels:
    app: backend
    env: dev

# Especificación del Deployment.
spec:
  # 1 réplica es suficiente para desarrollo.
  replicas: 1
  
  # Selector que vincula el Deployment con los Pods.
  selector:
    matchLabels:
      app: backend
      env: dev

  # Plantilla para crear los Pods.
  template:
    metadata:
      labels:
        app: backend
        env: dev
    spec:
      # Secreto para descargar la imagen privada de GHCR.
      imagePullSecrets:
        - name: ghcr-secret

      # Definición de los contenedores.
      containers:
        - name: backend
          # Imagen del backend (el pipeline de GitOps actualizará este tag).
          image: ghcr.io/jcruces-dev/backend-clinica-bp:sha-5a413f2659ebfe527b9360473a8af5541015be15
          ports:
            - containerPort: 8000

          # Variables de entorno inyectadas.
          env:
            # En Dev permitimos todo para facilitar las pruebas locales.
            - name: ALLOWED_HOSTS
              value: "*"
            - name: CORS_ALLOW_ALL_ORIGINS
              value: "True"

            # Inyección de secretos (Base de datos, Email, Stripe, etc.).
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SECRET_KEY
            - name: DEBUG
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DEBUG
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: POSTGRES_PASSWORD
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PORT
            - name: EMAIL_BACKEND
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_BACKEND
            - name: EMAIL_HOST
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_HOST
            - name: EMAIL_PORT
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_PORT
            - name: EMAIL_USE_TLS
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_USE_TLS
            - name: EMAIL_HOST_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_HOST_USER
            - name: EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_HOST_PASSWORD
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: STRIPE_SECRET_KEY
          
          # Recursos asignados (coinciden con el LimitRange de Dev).
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"