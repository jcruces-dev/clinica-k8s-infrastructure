# Versión de la API para objetos de red básicos.
apiVersion: v1

# Tipo de recurso: Service.
kind: Service

# Metadatos del Service.
metadata:
  # Nombre del servicio (usado por el frontend para llamar al backend).
  name: backend-service
  # Namespace de desarrollo.
  namespace: dev
  # Etiquetas para identificar el recurso.
  labels:
    app: backend
    env: dev

# Especificación de enrutamiento.
spec:
  # Selector: Enruta el tráfico a los Pods que tengan estas etiquetas.
  selector:
    app: backend
    env: dev

  # Configuración de los puertos.
  ports:
    - protocol: TCP
      # Puerto expuesto dentro del clúster.
      port: 8000
      # Puerto del contenedor de destino.
      targetPort: 8000

  # En Dev usamos LoadBalancer para poder probar la API desde Postman o el navegador.
  type: LoadBalancer