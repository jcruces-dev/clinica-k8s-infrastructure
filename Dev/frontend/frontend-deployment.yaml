apiVersion: apps/v1               # Versión de la API de Kubernetes que se usa para definir Deployments
kind: Deployment                  # Tipo de recurso: un Deployment gestiona Pods y ReplicaSets

metadata:
  name: frontend-deployment       # Nombre único del Deployment dentro del namespace
  namespace: dev                  # Namespace donde se desplegará (en este caso, entorno dev)
  labels:                         # Etiquetas para identificar este recurso
    app: frontend                 # Etiqueta que indica la aplicación (frontend)
    env: dev                      # Etiqueta que indica el entorno (dev)

spec:
  replicas: 1                     # Número de Pods que se crearán (1 réplica en dev para ahorrar recursos)
  selector:                       # Selector que define qué Pods controla este Deployment
    matchLabels:
      app: frontend               # Debe coincidir con los labels del template
      env: dev                    # Igual que arriba, asegura que solo controle Pods con estas etiquetas

  template:                       # Plantilla que define cómo serán los Pods creados
    metadata:
      labels:                     # Etiquetas que tendrán los Pods
        app: frontend             # Coincide con el selector (app: frontend)
        env: dev                  # Coincide con el selector (env: dev)
    spec:
      imagePullSecrets:           # Secret para autenticar en GHCR y poder descargar imágenes privadas
        - name: ghcr-secret       # Nombre del Secret de tipo docker-registry que creaste para GHCR

      containers:                 # Lista de contenedores dentro de cada Pod
        - name: frontend            # Nombre del contenedor
          image: ghcr.io/jcrucesb/frontend-clinica-bp:v1   # Imagen Docker que se usará (desde GHCR con tag v1)
          ports:
            - containerPort: 80     # Puerto expuesto dentro del contenedor (frontend escucha en 80)
