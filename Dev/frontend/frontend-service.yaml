# Versión de la API de Kubernetes para definir Services.
apiVersion: v1

# Tipo de recurso: Service.
kind: Service

# Metadatos del recurso.
metadata:
  # Nombre del Service.
  name: frontend-service
  # Namespace de desarrollo.
  namespace: dev
  # Etiquetas para identificar el recurso.
  labels:
    app: frontend
    env: dev

# Especificación del Service.
spec:
  # Selector: Enruta el tráfico a los Pods de frontend en Dev.
  selector:
    app: frontend
    env: dev

  # Configuración de los puertos.
  ports:
    - protocol: TCP
      # Puerto expuesto dentro del clúster.
      port: 80
      # Puerto del contenedor de Nginx.
      targetPort: 80
      
  # En Dev usamos LoadBalancer para obtener una IP pública de GCP y probar la app.
  type: LoadBalancer