# ==========================================================
# CONFIGURACIÓN PARA EL NAMESPACE: dev
# ==========================================================
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-quota
  namespace: dev
spec:
  hard:
    requests.cpu: "2"        # Máximo acumulado a solicitar: 2 Cores.
    requests.memory: "4Gi"    # Máximo acumulado a solicitar: 4 GB RAM.
    limits.cpu: "4"         # Máximo límite acumulado: 4 Core.
    limits.memory: "6Gi"      # Máximo límite acumulado: 6 GB RAM.
    pods: "15"                  # Máximo 15 Pods en el namespace
