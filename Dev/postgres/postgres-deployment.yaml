apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: dev
  labels:
    app: postgres
    env: dev

spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
      env: dev

  template:
    metadata:
      labels:
        app: postgres
        env: dev
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          
          env:
            # SOLUCIÓN PARA GCP: Evita el error de la carpeta 'lost+found'
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            
            # Credenciales obtenidas desde el Secret de Postgres
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

          # Montaje del disco y la configuración
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: postgres-config-volume
              mountPath: /etc/postgresql/conf.d/postgresql.conf
              subPath: postgresql.conf
            - name: postgres-config-volume
              mountPath: /etc/postgresql/conf.d/pg_hba.conf
              subPath: pg_hba.conf

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: postgres-config-volume
          configMap:
            name: postgres-config
