# Define la versión de la API de Kubernetes para objetos básicos de configuración y almacenamiento.
apiVersion: v1

# Especifica el tipo de recurso que estamos creando (un objeto de almacenamiento de datos sensibles).
kind: Secret

# Metadatos para identificar y aislar el recurso dentro del clúster.
metadata:
  # Nombre único con el que otros recursos (como el Deployment o StatefulSet de la BD) referenciarán este Secret.
  name: postgres-secret
  # Namespace donde vivirá el Secret, aislando las credenciales exclusivamente para el entorno de desarrollo.
  namespace: dev

# Tipo de Secret de Kubernetes; 'Opaque' indica que almacena datos clave-valor arbitrarios (formato estándar).
type: Opaque

# 'stringData' permite escribir las claves y valores en texto plano dentro del YAML;
# Kubernetes las convertirá automáticamente a formato Base64 al momento de aplicar el manifiesto.
stringData:
  # Nombre de la base de datos PostgreSQL que se creará automáticamente al inicializar el contenedor.
  POSTGRES_DB: "CAMBIAR_EN_ENTORNO_LOCAL"
  # Usuario administrador principal de la base de datos PostgreSQL.
  POSTGRES_USER: "CAMBIAR_EN_ENTORNO_LOCAL"
  # Contraseña para la autenticación del usuario administrador en la base de datos.
  POSTGRES_PASSWORD: "CAMBIAR_EN_ENTORNO_LOCAL"
