# Versión de la API de Kubernetes para definir un objeto de red (Service).
apiVersion: v1

# Tipo de recurso: Service (punto de acceso de red interno para los Pods).
kind: Service

# Metadatos del servicio.
metadata:
  # Nombre del servicio usado por el DNS interno (el backend se conecta usando este nombre).
  name: postgres-service
  # Namespace de desarrollo.
  namespace: dev

# Especificación de enrutamiento y puertos del servicio.
spec:
  # Selector para dirigir el tráfico únicamente a los Pods de PostgreSQL de Dev.
  selector:
    app: postgres
    env: dev

  # Al poner 'None', creamos un "Headless Service". 
  # Esto hace que Kubernetes no le asigne una IP fija (ClusterIP), 
  # sino que cree un registro DNS único para cada Pod (ej. postgres-statefulset-0.postgres-service).
  # Es el estándar de la industria para bases de datos.
  clusterIP: None

  # Definición de los puertos expuestos.
  ports:
    # Protocolo de red utilizado.
    - protocol: TCP
      # Puerto expuesto dentro de la red del clúster (el backend usa este).
      port: 5432
      # Puerto del contenedor destino (el que escucha Postgres).
      targetPort: 5432