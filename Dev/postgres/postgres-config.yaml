# Versión de la API de Kubernetes usada para definir un ConfigMap.
apiVersion: v1

# Tipo de recurso: ConfigMap (almacena configuración no sensible).
kind: ConfigMap

# Metadatos para identificar el recurso.
metadata:
  # Nombre del ConfigMap (será referenciado por el StatefulSet/Deployment de Postgres).
  name: postgres-config
  # Namespace de desarrollo.
  namespace: dev

# Sección que contiene los archivos de configuración.
data:
  # Archivo de configuración principal de PostgreSQL.
  postgresql.conf: |
    # Escucha peticiones en todas las interfaces de red del contenedor.
    listen_addresses = '*'

  # Archivo de reglas de acceso (Host-Based Authentication).
  pg_hba.conf: |
    # Conexiones locales (socket UNIX): exigen contraseña encriptada (md5).
    local   all   all   md5
    
    # Conexiones TCP/IP IPv4: permite conexión desde cualquier IP (0.0.0.0/0) exigiendo contraseña.
    host    all   all   0.0.0.0/0 md5