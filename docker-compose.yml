# Nombre del proyecto en Docker Compose. Sirve para agrupar los contenedores bajo un mismo nombre.
name: clinica_buenpaciente

# Aquí comienza la definición de los contenedores (servicios).
services:

  # ==============================================================================
  # 1. Base de Datos PostgreSQL
  # ==============================================================================
  db:
    # Utiliza la imagen oficial de PostgreSQL versión 18.
    image: postgres:18
    # Nombre que tendrá el contenedor en el sistema (lo verás en Docker Desktop).
    container_name: postgres_db
    # Carga las variables de entorno (usuario, contraseña, nombre de BD) desde el archivo .env.
    env_file:
      - ./Clinica_Repositorio_BACKEND_DRF/Clinica_DRF/.env
    # Persistencia de los datos: guarda los datos de la BD en un volumen de Docker.
    volumes:
      # Ruta actualizada y requerida para PostgreSQL 18 (¡el cambio que solucionamos!).
      - db_data:/var/lib/postgresql
    # Conecta este contenedor a la red interna de Docker llamada "app_net".
    networks:
      - app_net
    # Política de reinicio: Docker lo enciende solo cuando enciendes Docker Desktop, a menos que lo apagues manualmente.
    restart: unless-stopped

  # ==============================================================================
  # 2. Backend de Django REST Framework
  # ==============================================================================
  backend:
    # Configuración para construir la imagen de este servicio.
    build: 
      # Ruta donde se encuentra el código y el Dockerfile del backend.
      context: ./Clinica_Repositorio_BACKEND_DRF
      # Le dice a Docker que use la etapa "development" de tu Multi-Stage Dockerfile (la que tiene Pytest).
      target: development
    # Nombre asignado al contenedor del backend.
    container_name: drf_backend_clinica
    # Establece el directorio de trabajo interno dentro del contenedor.
    working_dir: /app
    # Carga las variables de entorno desde el archivo .env del backend.
    env_file:
      - ./Clinica_Repositorio_BACKEND_DRF/Clinica_DRF/.env
    # Sobrescribe variables de entorno específicas para este contenedor.
    environment:
      # Le dice a Django que busque la BD en el contenedor llamado "db", no en localhost.
      - DB_HOST=db
    # Sincroniza el código de tu computadora con el contenedor (para ver cambios en vivo sin reiniciar).
    volumes:
      - "./Clinica_Repositorio_BACKEND_DRF:/app"
    # Mapea el puerto 8000 de tu PC al puerto 8000 del contenedor (para entrar desde el navegador).
    ports:
      - "8000:8000"
    # Indica que el contenedor "db" debe iniciarse antes que este.
    depends_on:
      - db
    # Conecta el backend a la red interna y le da un alias.
    networks:
      app_net:
        aliases:
          # Permite que Nginx (el frontend) encuentre este backend usando la URL 'http://backend-service:8000'.
          - backend-service
    # Reinicia el contenedor automáticamente si falla o al iniciar Docker.
    restart: unless-stopped
    # El comando exacto que se ejecutará al encender el contenedor (inicia el servidor de desarrollo de Django).
    command: python Clinica_DRF/manage.py runserver 0.0.0.0:8000

  # ==============================================================================
  # 3. Frontend Web en Nginx
  # ==============================================================================
  frontend:
    # Ruta donde está el Dockerfile del frontend.
    build: ./Clinica_Frontend_JavaScript
    # Nombre asignado al contenedor del servidor web.
    container_name: nginx_frontend_clinica
    # Mapea el puerto 80 de tu PC al puerto 80 del contenedor (para entrar por http://localhost).
    ports:
      - "80:80"
    # Monta los archivos estáticos (HTML/JS) en modo lectura (ro) dentro de Nginx.
    volumes:
      - "./Clinica_Frontend_JavaScript/Clinica_HTML:/usr/share/nginx/html:ro"
    # Conecta el frontend a la red interna.
    networks:
      - app_net
    # Indica que el backend debe iniciarse antes que el frontend.
    depends_on:
      - backend
    # Reinicia el contenedor automáticamente.
    restart: unless-stopped

# ==============================================================================
# DEFINICIONES GLOBALES
# ==============================================================================
# Define el volumen para que los datos de la BD no se borren al apagar el contenedor.
volumes:
  db_data:

# Define la red interna para que los contenedores se comuniquen entre sí de forma aislada.
networks:
  app_net:
    driver: bridge